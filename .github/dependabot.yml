version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ["next", "@next/*", "react", "react-dom", "@types/react*", "eslint-config-next"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["next", "@next/*", "react", "react-dom", "@types/react*", "eslint-config-next"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
