version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      next-react:
        patterns: ["next", "@next/*", "react", "react-dom", "@types/react*", "eslint-config-next"]
      tooling:
        patterns: ["*"]
        exclude-patterns: ["next", "@next/*", "react", "react-dom", "@types/react*", "eslint-config-next"]
    open-pull-requests-limit: 5
    # Wait a week before proposing a new release: most malicious npm versions are detected and pulled within days.
    # Security updates are not delayed.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
